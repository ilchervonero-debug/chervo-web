<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Fondo -->
  <rect width="192" height="192" fill="#F2F2F0"/>

  <!-- Reloj (círculo) -->
  <circle cx="96" cy="105" r="55" fill="none" stroke="#1C1C1C" stroke-width="4"/>

  <!-- Centro del reloj -->
  <circle cx="96" cy="105" r="3" fill="#1C1C1C"/>

  <!-- Manecilla de horas (corta, apuntando a las 3) -->
  <line x1="96" y1="105" x2="135" y2="105" stroke="#1C1C1C" stroke-width="3" stroke-linecap="round"/>

  <!-- Manecilla de minutos (larga, apuntando a las 12) -->
  <line x1="96" y1="105" x2="96" y2="55" stroke="#1C1C1C" stroke-width="3" stroke-linecap="round"/>

  <!-- Punto rojo (notificación arriba de las 12) -->
  <circle cx="96" cy="25" r="16" fill="#FF3333"/>
</svg>
