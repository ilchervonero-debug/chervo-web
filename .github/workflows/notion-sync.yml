name: Sync Notion to Web

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Show generate.js
        run: head -3 generate.js

      - name: Generate index.html from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_SERVICIOS: ea31d8ef34204bef9382e1349cc6abc0
          DB_CLIENTES: 8067c2e0ce674abc8ebd945d8e5e5fa2
          DB_HERO: b8d90928c7404c32b83ee5928d343fd0
          DB_CONTACTO: 4b0d6741c2f64906b92efc71bdc014bc
          DB_APLICACIONES: 7b5718476b0b4eacbab7082ddee0431a
        run: node generate.js

      - name: Commit and push if changed
        run: |
          git config user.name "chervo-bot"
          git config user.email "ilchervonero@gmail.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "sync: update from Notion" && git push)
