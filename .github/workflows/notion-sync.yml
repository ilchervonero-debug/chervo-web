name: Sync Notion to Web

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Show generate.js
        run: head -3 generate.js

      - name: Generate index.html from Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DB_SERVICIOS: 72c5dd1bfa924029888fa38f5d8fe227
          DB_CLIENTES: aa3c4fd2ad4d4ebb939fd2a91c241fa8
          DB_CONFIG: 94457ed98d444bc190f630e7c4276fda
          DB_APLICACIONES: 50ef93197a294f13990ab130f3ffa9c8
        run: node generate.js

      - name: Commit and push if changed
        run: |
          git config user.name "chervo-bot"
          git config user.email "ilchervonero@gmail.com"
          git add index.html
          git diff --cached --quiet || (git commit -m "sync: update from Notion" && git push)
